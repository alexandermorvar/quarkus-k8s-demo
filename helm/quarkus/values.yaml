replicaCount: 2

image:
  repository: chrisqhapaq/quarkus-k8s-demo
  tag: "1de58668963dc5b8b57e8550ed558b982acfa542"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

resources:

  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: 1000m
    memory: 1Gi

config:

  datasource:

    jdbcUrl: personasdb

  hibernate:

    generation: validate

  flyway:

    migrateAtStart: "true"

postgres:

  database: personasdb

  username: quarkus

  password: quarkus123

ingress:

  enabled: true

  className: traefik

  host: quarkus.local

  path: /

  pathType: Prefix

autoscaling:

  enabled: false

  minReplicas: 2

  maxReplicas: 5

  targetCPUUtilizationPercentage: 50

monitoring:

  enabled: false

  release: monitoring
  
  namespace: monitoring

  interval: 15s

  path: /q/metrics

  port: http

postgresql:

  auth:
    username: quarkus

    password: quarkus123

    database: personasdb

  primary:

    persistence:

      enabled: true

      size: 2Gi