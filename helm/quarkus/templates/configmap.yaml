apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "quarkus.fullname" . }}-config
  namespace: {{ .Release.Namespace }}

data:

  QUARKUS_DATASOURCE_JDBC_URL: >-
    jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}

  QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: "{{ .Values.config.hibernate.generation }}"

  QUARKUS_FLYWAY_MIGRATE_AT_START: "{{ .Values.config.flyway.migrateAtStart }}"